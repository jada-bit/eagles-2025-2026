<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eagles Playbook 3D (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f5; --panel:#ffffff; --panel2:#e9e9ec; --line:#d4d4d8; --ink:#18181b; --muted:#52525b; --gold:#d99a00; --on-gold:#111;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#08090b; --panel:#15161a; --panel2:#1d1f24; --line:#2c2f36; --ink:#f4f4f5; --muted:#a1a1aa; --gold:#FFB81C; --on-gold:#111; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#08090b; --panel:#15161a; --panel2:#1d1f24; --line:#2c2f36; --ink:#f4f4f5; --muted:#a1a1aa; --gold:#FFB81C; --on-gold:#111; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
header h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800;font-style:italic;text-transform:uppercase;line-height:.95}
header h1 span{color:var(--gold)}
header p{margin:4px 0 12px;color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:var(--gold);color:var(--on-gold);vertical-align:6px;margin-left:8px;font-style:normal}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:14px;align-items:start}
.stage{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .hint{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.8rem;padding:4px 8px;border-radius:8px;pointer-events:none}
.stage .err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:1.6rem}
.muted{color:var(--muted)}
.label{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 6px}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.1rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.spots{display:flex;gap:6px}
.spots button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.25rem}
.spots button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.spots button:disabled{opacity:.35}
.controls{display:flex;gap:8px;margin-top:12px}
.controls button{flex:1;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.controls button.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.caption{background:var(--panel2);border-radius:12px;padding:12px 14px;margin-top:12px;min-height:80px}
.caption b{font-family:"Barlow Condensed",sans-serif;color:var(--gold)}
@media (max-width:820px){ .layout{grid-template-columns:1fr} }
.reads{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.reads-q{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.1rem;color:var(--gold)}
.reads button{min-height:44px;border-radius:10px;border:1px solid var(--gold);background:var(--panel);color:var(--ink);font-weight:700;text-align:left;padding:8px 12px}
.reads button.keep{border-color:var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Eagles <span>Playbook 3D</span><span class="tag">Prototype</span></h1>
    <p>Watch from the stands, then put yourself on the court.</p>
  </header>
  <div class="layout">
    <div class="stage" id="stage"><div class="hint" id="hint">Drag to turn the view</div></div>
    <div class="card">
      <div class="label" style="margin-top:0">Play</div>
      <select id="playPicker" aria-label="Play" style="width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-weight:600;padding:0 10px"></select>
      <h2 id="playName" style="margin-top:10px">Give and Go</h2>
      <div class="muted" id="playSummary">A basic play to test the 3D view.</div>
      <div class="label">View</div>
      <div class="seg" role="group" aria-label="View">
        <button id="viewBroadcast" aria-pressed="true">From the stands</button>
        <button id="viewFirst" aria-pressed="false">First person</button>
      </div>
      <div class="label">Be player</div>
      <div class="spots" id="spots"></div>
      <div class="controls">
        <button class="primary" id="playBtn">Play</button>
        <button id="restartBtn">Restart</button>
      </div>
      <div class="seg" style="margin-top:8px" role="group" aria-label="Speed">
        <button id="slowBtn" aria-pressed="false">Slow</button>
        <button id="normalBtn" aria-pressed="true">Normal</button>
      </div>
      <div class="caption" aria-live="polite"><b id="stepNo"></b><div id="say"></div><div class="reads" id="reads" hidden></div></div>
    </div>
  </div>
</div>

  board.position.set(0, 11.25, 4); scene.add(board);
  const square = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.5), new THREE.MeshBasicMaterial({ color: 0xd94a1e, wireframe: true })); square.position.set(0, 10.85, 4.09); scene.add(square);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.06, 8, 32), new THREE.MeshLambertMaterial({ color: 0xff6a00 }));

  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 7), new THREE.MeshLambertMaterial({ color: 0x333333 })); arm.position.set(0, 11.5, 0.5); scene.add(arm);

// players: simple figures with a jersey number floating above
function numberSprite(n) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  g.fillStyle = 'rgba(15,23,42,.85)'; g.beginPath(); g.arc(64, 64, 56, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.font = '800 80px "Barlow Condensed", Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(n, 64, 70);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false })); s.scale.set(1.6, 1.6, 1); return s;
}
const players = {};
for (const p of Object.keys(PLAY.start)) {
  const grp = new THREE.Group();
  const jersey = new THREE.MeshLambertMaterial({ color: 0x1f3a8a });
  const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.45, 2.6, 14), new THREE.MeshLambertMaterial({ color: 0x111827 })); legs.position.y = 1.3;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.6, 2.2, 14), jersey); body.position.y = 3.6;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12), new THREE.MeshLambertMaterial({ color: 0x8d5a3b })); head.position.y = 5.2;
  const tag = numberSprite(p); tag.position.y = 6.7;
  grp.add(legs, body, head, tag); scene.add(grp);
  players[p] = { grp, jersey, tag };
}
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.55, 18, 14), new THREE.MeshLambertMaterial({ color: 0xff7a1a, emissive: 0x3a1500 })); scene.add(ball);
// faint path line for the current step's cuts
const pathMat = new THREE.LineDashedMaterial({ color: 0xFFB81C, dashSize: 0.8, gapSize: 0.5 });
let pathLines = [];
function showPaths(k) {
  pathLines.forEach(l => scene.remove(l)); pathLines = [];
  const st = stateAt(k);
  for (const m of VIEW.steps[k].moves) {
    if (m.type === 'pass') continue;
    if (m.type === 'shot') continue;
    const geo = new THREE.BufferGeometry().setFromPoints(movePts(st.pos[m.p], m).map(q => W(q[0], q[1], 0.05)));
    const l = new THREE.Line(geo, pathMat); l.computeLineDistances(); scene.add(l); pathLines.push(l);
  }
}

/* ---------- cameras ---------- */
let view = 'broadcast', me = 1;
const orbit = { theta: 0.35, phi: 0.95, r: 52, target: new THREE.Vector3(0, 3, 15) };
const lookNow = new THREE.Vector3(0, 5, 5);
function placeBroadcast() {
  camera.position.set(orbit.target.x + orbit.r * Math.sin(orbit.phi) * Math.sin(orbit.theta), orbit.target.y + orbit.r * Math.cos(orbit.phi), orbit.target.z + orbit.r * Math.sin(orbit.phi) * Math.cos(orbit.theta));
  camera.lookAt(orbit.target);
}
let dragging = null;
renderer.domElement.addEventListener('pointerdown', e => { if (view !== 'broadcast') return; dragging = { x: e.clientX, y: e.clientY, theta: orbit.theta, phi: orbit.phi }; renderer.domElement.setPointerCapture(e.pointerId); document.getElementById('hint').style.display = 'none'; });
renderer.domElement.addEventListener('pointermove', e => { if (!dragging) return; orbit.theta = dragging.theta - (e.clientX - dragging.x) * 0.008; orbit.phi = Math.min(1.35, Math.max(0.35, dragging.phi - (e.clientY - dragging.y) * 0.006)); });
renderer.domElement.addEventListener('pointerup', () => dragging = null);
renderer.domElement.addEventListener('wheel', e => { if (view !== 'broadcast') return; e.preventDefault(); orbit.r = Math.min(80, Math.max(25, orbit.r + e.deltaY * 0.03)); }, { passive: false });

/* ---------- drawing a frame ---------- */
let k = 0, t = 0, playing = false, speed = 1, pauseLeft = 0;
const HAND = 3.9;
// NEW: who is this screen for? The mover (this step, or the next one if the screen is set first)
// whose path passes closest to the screen spot. Returns where that player is right now.
function distToPath(pt, pts) {
  let best = Infinity;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1;
    const u = Math.max(0, Math.min(1, ((pt[0] - a[0]) * dx + (pt[1] - a[1]) * dy) / L2));
    best = Math.min(best, Math.hypot(pt[0] - (a[0] + dx * u), pt[1] - (a[1] + dy * u)));
  }
  return pts.length === 1 ? Math.hypot(pt[0] - pts[0][0], pt[1] - pts[0][1]) : best;
}
function findScreenUser(screener, spot, steps) {
  let best = null;
  for (const kk of steps) {
    const stp = VIEW.steps[kk]; if (!stp) continue;
    const base = stateAt(kk);
    for (const m of stp.moves) {
      if (m.type === 'pass' || m.type === 'shot' || m.type === 'screen' || m.p == screener || !base.pos[m.p]) continue;
      const d = distToPath(spot, movePts(base.pos[m.p], m));
      if (d < 90 && (!best || d < best.d)) best = { p: m.p, d };
    }
    if (best) break;
  }
  return best && best.p;
}
function screenTarget(p, f) {
  const step = VIEW.steps[k], mine = step.moves.find(m => m.p == p && m.type !== 'pass' && m.type !== 'shot');
  let user = null;
  if (mine && mine.type === 'screen') { if (ease(t) > 0.6) user = findScreenUser(p, mine.to, [k, k + 1]); }
  else if (!mine && k > 0) {
    const prev = VIEW.steps[k - 1].moves.find(m => m.p == p && m.type === 'screen');
    if (prev) user = findScreenUser(p, prev.to, [k]);
  }
  return user && f.pos[user] ? W(...f.pos[user]) : null;
}
function draw() {
  const f = frame(k, t);
  for (const p in players) {
    const [x, y] = f.pos[p], pl = players[p], v = W(x, y);
    pl.grp.position.copy(v);
    // face the direction of travel while moving; screeners face the player they're screening for;
    // everyone else faces the basket. Turning is smoothed so nobody snaps around.
    let look = f.moving.has(p) ? W(...along(movePts(stateAt(k).pos[p], VIEW.steps[k].moves.find(m => m.p == p)), Math.min(1, ease(t) + 0.05))) : W(250, 62.5);
    const tgt = screenTarget(p, f);
    if (tgt) look = tgt;
    const want = Math.atan2(look.x - v.x, look.z - v.z);
    if (pl.yaw == null) pl.yaw = want;
    let diff = want - pl.yaw; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    pl.yaw += diff * (playing ? 0.18 : 1);
    pl.grp.rotation.set(0, pl.yaw, 0);
    pl.jersey.color.setHex(p == me && view === 'first' ? 0xFFB81C : 0x1f3a8a);
    pl.grp.visible = !(view === 'first' && p == me);
  }
  if (f.ball.holder != null) {
    const hp = f.ball.holder, v = W(...f.pos[hp]);
    // the ball sits at the player's right hand, relative to which way the player faces
    const fwd = new THREE.Vector3(); players[hp].grp.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
    // NEW: dribbling. A real bounce from the hand to the floor, about one bounce every 4 feet.
    const drib = VIEW.steps[k].moves.find(m => m.type === 'dribble' && m.p == hp);
    let y = HAND - 0.4;
    if (drib && t > 0 && t < 1) {
      const lenFt = plen(movePts(stateAt(k).pos[hp], drib)) / 10, bounces = Math.max(4, Math.round(lenFt / 3));
      y = 0.55 + (HAND - 1.0) * Math.abs(Math.cos(Math.PI * ease(t) * bounces));
    }
    ball.position.set(v.x + right.x * 0.85 + fwd.x * 0.5, y, v.z + right.z * 0.85 + fwd.z * 0.5);
  }
  else if (f.ball.shot) {
    const a = W(...f.ball.shot), rim = new THREE.Vector3(0, 10, 5.25), tt = f.ball.t;
    const dist = Math.hypot(a.x - rim.x, a.z - rim.z), apex = 10 + Math.min(6, 2 + dist * 0.18);
    if (tt < 0.85) { // release to rim: a parabola peaking above the rim
      const u = tt / 0.85, start = HAND + 1.6;
      const y = (1 - u) * (1 - u) * start + 2 * (1 - u) * u * (2 * apex - (start + 10) / 2) + u * u * 10;
      ball.position.set(a.x + (rim.x - a.x) * u, y, a.z + (rim.z - a.z) * u);
    } else { const u = (tt - 0.85) / 0.15; ball.position.set(rim.x, 10 - 3.5 * u, rim.z); } // through the net
  }
  else if (f.ball.atRim) ball.position.set(0.6, 0.55, 6.6); // resting under the hoop after a shot
  else { const a = W(...f.ball.from), b = W(...f.ball.to), e = f.ball.e; ball.position.set(a.x + (b.x - a.x) * e, HAND + Math.sin(Math.PI * e) * 2.2, a.z + (b.z - a.z) * e); }

  if (view === 'broadcast') placeBroadcast();
  else {
    const mePos = W(...f.pos[me], 5.4);
    camera.position.lerp(mePos, 0.35);
    // look at the ball, or at the rim when holding it, smoothed so it doesn't jerk around
    const want = f.ball.holder == me ? W(250, 62.5, 9) : ball.position.clone();
    lookNow.lerp(want, 0.08);
    camera.lookAt(lookNow);
  }
  renderer.render(scene, camera);
}
function stateAtMain(play, kk) { const pos = {}; for (const p in play.start) pos[p] = [...play.start[p]]; let ball = play.ball; for (let i = 0; i < kk; i++) for (const m of play.steps[i].moves) { if (m.type === 'pass') ball = m.to; else if (m.type === 'shot') ball = null; else pos[m.p] = [...m.to]; } return { pos, ball }; }
function makeView() {
  if (branch == null) { VIEW = PLAY; return; }
  const o = PLAY.options[branch], st = stateAtMain(PLAY, o.from + 1);
  VIEW = { ...PLAY, start: st.pos, ball: st.ball, steps: (o.steps && o.steps.length) ? o.steps : [{ say: o.name, moves: [] }] };
}
function optionsHere() {
  if (branch != null) return [];
  const n = PLAY.steps.length;
  return (PLAY.options || []).map((o, i) => ({ o, i })).filter(({ o }) => atEnd ? o.from === n - 1 : (o.from + 1 === k && t === 0));
}
const esc3 = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function caption() {
  const n = VIEW.steps.length, opt = branch != null ? PLAY.options[branch] : null;
  document.getElementById('stepNo').textContent = opt ? `${opt.name}: step ${k + 1} of ${n}` : (atEnd ? 'End of the play' : `Step ${k + 1} of ${n}`);
  document.getElementById('say').textContent = VIEW.steps[k].say || '';
  const box = document.getElementById('reads'), here = optionsHere();
  if (here.length) {
    box.hidden = false;
    box.innerHTML = `<div class="reads-q">What's open?</div>` + here.map(({ o, i }) => `<button data-opt="${i}">${esc3(o.name)}</button>`).join('') + (atEnd ? '' : `<button data-keep="1" class="keep">Keep running the play</button>`);
  } else if (opt && k === n - 1) {
    const others = (PLAY.options || []).map((o, i) => ({ o, i })).filter(({ o, i }) => i !== branch && o.from === opt.from);
    box.hidden = false;
    box.innerHTML = `<button data-back="1" class="keep">Back to the play</button>` + (others.length ? `<div class="reads-q">Try another read</div>` + others.map(({ o, i }) => `<button data-opt="${i}">${esc3(o.name)}</button>`).join('') : '');
  } else { box.hidden = true; box.innerHTML = ''; }
  box.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => chooseOption(+b.dataset.opt));
  const keep = box.querySelector('[data-keep]'); if (keep) keep.onclick = () => { box.hidden = true; playing = true; pauseLeft = 0; setPlayLabel(); };
  const back = box.querySelector('[data-back]'); if (back) back.onclick = backToPlay;
}
function chooseOption(i) { branch = i; atEnd = false; makeView(); k = 0; t = 0; pauseLeft = 0.3; playing = true; caption(); showPaths(0); setPlayLabel(); }
function backToPlay() {
  const o = PLAY.options[branch], n = PLAY.steps.length; branch = null; makeView();
  if (o.from + 1 < n) { k = o.from + 1; t = 0; atEnd = false; } else { k = n - 1; t = 1; atEnd = true; }
  playing = false; caption(); showPaths(k); setPlayLabel();
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) {
    if (pauseLeft > 0) pauseLeft -= dt * speed;
    else {
      t += dt * speed / (VIEW.steps[k].moves.length ? 1.6 : 1.2);
      if (t >= 1) {
        if (k < VIEW.steps.length - 1) {
          k++; t = 0; pauseLeft = 0.5; showPaths(k);
          if (optionsHere().length) { playing = false; pauseLeft = 0; } // pause so players can pick a read
          caption(); setPlayLabel();
        }
        else { t = 1; playing = false; if (branch == null) atEnd = true; caption(); setPlayLabel(); }
      }
    }
  }
  draw();
  requestAnimationFrame(loop);
}
function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize);

/* ---------- controls ---------- */
const playBtn = document.getElementById('playBtn');
const finished = () => atEnd || (k === VIEW.steps.length - 1 && t >= 1);
function setPlayLabel() { playBtn.textContent = playing ? 'Pause' : (finished() ? 'Watch again' : (optionsHere().length ? 'Keep running' : 'Play')); }
playBtn.onclick = () => {
  if (!playing && finished()) { branch = null; atEnd = false; makeView(); k = 0; t = 0; caption(); showPaths(0); playing = true; setPlayLabel(); return; }
  playing = !playing; if (playing) document.getElementById('reads').hidden = true; setPlayLabel();
};
document.getElementById('restartBtn').onclick = () => { branch = null; atEnd = false; makeView(); k = 0; t = 0; playing = false; caption(); showPaths(0); setPlayLabel(); lookNow.set(0, 5, 5); };
const spots = document.getElementById('spots');
spots.innerHTML = [1, 2, 3, 4, 5].map(p => `<button data-p="${p}" aria-pressed="${p === me}">${p}</button>`).join('');
spots.querySelectorAll('button').forEach(b => b.onclick = () => { me = +b.dataset.p; spots.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); if (view === 'broadcast') setView('first'); camera.position.copy(W(...frame(k, t).pos[me], 5.4)); });
function setView(v) {
  view = v;
  document.getElementById('viewBroadcast').setAttribute('aria-pressed', v === 'broadcast');
  document.getElementById('viewFirst').setAttribute('aria-pressed', v === 'first');
  document.getElementById('hint').textContent = v === 'broadcast' ? 'Drag to turn the view' : `You are ${me}. The camera follows the ball.`;
  document.getElementById('hint').style.display = '';
  camera.fov = v === 'first' ? 70 : 55; camera.updateProjectionMatrix();
  if (v === 'first') camera.position.copy(W(...frame(k, t).pos[me], 5.4));
}
document.getElementById('viewBroadcast').onclick = () => setView('broadcast');
document.getElementById('viewFirst').onclick = () => setView('first');
document.getElementById('slowBtn').onclick = () => { speed = 0.5; document.getElementById('slowBtn').setAttribute('aria-pressed', true); document.getElementById('normalBtn').setAttribute('aria-pressed', false); };
document.getElementById('normalBtn').onclick = () => { speed = 1; document.getElementById('slowBtn').setAttribute('aria-pressed', false); document.getElementById('normalBtn').setAttribute('aria-pressed', true); };

function selectPlay(i) {
  PLAY = PLAYS[i]; branch = null; atEnd = false; makeView(); k = 0; t = 0; playing = false; pauseLeft = 0; lookNow.set(0, 5, 5);
  document.getElementById('playName').textContent = PLAY.name || 'Play';
  document.getElementById('playSummary').textContent = PLAY.summary || '';
  document.getElementById('playPicker').value = String(i);
  caption(); showPaths(0); setPlayLabel();
}
// NEW: a dropdown grouped by type, so it stays tidy as the playbook grows.
function buildPicker() {
  const el = document.getElementById('playPicker'); el.innerHTML = '';
  const groups = {};
  PLAYS.forEach((p, i) => { (groups[p.category || 'Plays'] = groups[p.category || 'Plays'] || []).push([p, i]); });
  Object.keys(groups).forEach(cat => {
    const og = document.createElement('optgroup'); og.label = cat;
    groups[cat].forEach(([p, i]) => { const o = document.createElement('option'); o.value = String(i); o.textContent = p.name || `Play ${i + 1}`; og.appendChild(o); });
    el.appendChild(og);
  });
  el.onchange = () => selectPlay(+el.value);
}
buildPicker();
resize(); selectPlay(0); requestAnimationFrame(loop);

try {

    if (!firebase.apps.length) firebase.initializeApp({ apiKey: "AIzaSyA5H5SsumWG7bym_0EZ7jOlfWeswpSauhk", authDomain: "eagles-stats.firebaseapp.com", projectId: "eagles-stats", appId: "1:386723096734:web:b50e343c703983e838b38f" });
    const testMode = new URLSearchParams(location.search).has('test');
    firebase.firestore().collection(testMode ? 'test_plays' : 'plays').where('published', '==', true).onSnapshot(snap => {
      const live = snap.docs.map(d => d.data()).filter(p => p.start && Array.isArray(p.steps) && p.steps.length && [1, 2, 3, 4, 5].every(n => p.start[n]))
        .sort((a, b) => (a.category || '').localeCompare(b.category || '') || (a.name || '').localeCompare(b.name || ''));
      PLAYS = live.length ? [...live, GIVE_AND_GO] : [GIVE_AND_GO];
      buildPicker(); selectPlay(0);
    }, () => {});

})();
